services:
  # Edge Gateway / Nginx Reverse Proxy
  reverse-proxy:
    image: nginx:1.25-alpine
    container_name: inprac_reverse_proxy
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - edge-net

  # Core API Microservice
  api:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: inprac_api_service
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    environment:
      - APP_ENV=production
      - REDIS_HOST=cache
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - edge-net
      - data-net

  # In-Memory Cache (Redis) - Completely isolated in data-net
  cache:
    image: redis:7.2-alpine
    container_name: inprac_cache
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    command: redis-server --appendonly yes --maxmemory 96mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - data-net

networks:
  # Edge network: Nginx to API
  edge-net:
    driver: bridge
  # Internal data network: API to Redis only (isolated from Nginx & outside world)
  data-net:
    driver: bridge
    internal: true

volumes:
  redis_data:
