version: '3.8'

services:
  # Edge Gateway / Nginx Reverse Proxy
  reverse-proxy:
    image: nginx:1.25-alpine
    container_name: inprac_reverse_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal-net

  # Core API Microservice
  api:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: inprac_api_service
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - REDIS_HOST=cache
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - internal-net

  # In-Memory Cache (Redis) - Completely isolated from public internet
  cache:
    image: redis:7.2-alpine
    container_name: inprac_cache
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    networks:
      - internal-net

networks:
  internal-net:
    driver: bridge

volumes:
  redis_data:
