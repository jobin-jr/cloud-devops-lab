name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-infrastructure:
    name: Validate Docker & Shell Infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config --quiet
          echo "Docker Compose syntax is valid."

      - name: Validate Shell Script Syntax
        run: |
          bash -n scripts/deploy.sh
          bash -n scripts/backup.sh
          echo "All shell scripts passed syntax inspection."

  validate-backend:
    name: Validate Python Application Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Application Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Python Bytecode Compilation Check
        run: |
          python -m compileall app/
          echo "Python application syntax and byte-compilation valid."

  validate-docs:
    name: Validate Runbooks & Operational Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Runbook Manifest & Integrity
        run: |
          REQUIRED_RUNBOOKS=(
            "docs/runbooks/README.md"
            "docs/runbooks/502-bad-gateway-rca.md"
            "docs/runbooks/cgroup-oom-mitigation.md"
            "docs/runbooks/backup-restoration-drill.md"
            "docs/runbooks/redis-data-recovery.md"
            "docs/runbooks/minecraft-server-incident-response.md"
          )
          for runbook in "${REQUIRED_RUNBOOKS[@]}"; do
            if [ ! -f "$runbook" ]; then
              echo "Error: Missing required operational runbook $runbook"
              exit 1
            fi
            if [ ! -s "$runbook" ]; then
              echo "Error: Operational runbook $runbook is empty!"
              exit 1
            fi
            echo "Verified: $runbook ($(wc -l < "$runbook") lines, $(wc -c < "$runbook") bytes)"
          done
          echo "All operational runbooks verified."

          if [ ! -s "docs/slo-and-error-budget.md" ]; then
            echo "Error: docs/slo-and-error-budget.md is missing or empty!"
            exit 1
          fi
          echo "Verified: docs/slo-and-error-budget.md"

  security-audit:
    name: DevSecOps Vulnerability & Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Audit Python Dependencies for Known CVEs
        run: |
          pip install pip-audit
          pip-audit -r app/requirements.txt || echo "Audit completed with warnings."

      - name: Run Trivy Filesystem Vulnerability & Secret Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

